{% extends 'base.html' %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <div class="panel">
        <h2 style="margin-top:0;">Acceso</h2>

        {% if error %}
            <div class="error-box" style="display:block;">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'form_login' %}">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}
            <div class="form-field" style="margin-bottom:20px;">
                <label for="apikey">Apikey</label>
                <input type="text" id="apikey" name="apikey" required autofocus>
            </div>
            <button type="submit" style="width:100%;">Entrar</button>
        </form>
    </div>
</div>
{% endblock %}
